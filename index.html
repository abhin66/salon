V.comm=()=>{const m={Today:1,"This week":6,Month:26}[S.per],L=[["Raju",12,4300],["Sameer",10,3100],["Imran",9,2800],["Pooja",9,4400]],t=L.reduce((a,x)=>a+x[2]*m*.4,0);return `<div class="seg a" style="margin-bottom:14px">${Object.keys({Today:1,"This week":1,Month:1}).map(p=>`<button class="${S.per==p?"on":""}" data-a="per" data-v="${p}">${p}</button>`).join("")}</div><div class="split"><div class="card a" style="--i:1">${L.map(([n,c,v])=>`<div class="rw">${av(n)}<div class="g"><b>${n}</b><div class="sub">${c*m} customers · ${fmt(v*m)}</div></div><div style="text-align:right"><small>40%</small><br><b style="font-size:17px">${fmt(v*m*.4)}</b></div></div>`).join("")}</div><div class="col sticky"><div class="hero a fb" style="--i:2"><span>Total commission</span><b style="font-size:28px">${fmt(t)}</b></div><button class="btn a" style="--i:3" data-a="cwa">${ic("send",18)} Send to staff on WhatsApp</button></div></div>`};
function loginUI(){$("#app").innerHTML=`<div class="lg"><div class="lt">${tbtn()}</div><div class="lc card a"><div class="logo">${ic("scis",30)}</div><div style="text-align:center"><h1>Your Salon</h1><small>Log in to continue</small></div><div><label>MOBILE NUMBER</label><input class="in2" type="tel" inputmode="tel" placeholder="+91 98765 43210" aria-label="Mobile number"></div><div><label>OTP</label><div class="otp">${[1,2,3,4].map(()=>'<input class="in2" maxlength="1" placeholder="•" inputmode="numeric" aria-label="OTP digit">').join("")}</div></div><div><label>I AM A</label><div class="seg rs" id="rs">${Object.keys(R).map(k=>`<button class="${k==S.pr?"on":""}" data-a="pick" data-v="${k}">${R[k].n}</button>`).join("")}</div></div><button class="btn" data-a="login">Login ${ic("ok",18)}</button><small style="text-align:center">Demo: pick a role and tap Login. Everyone only sees their own work.</small></div></div>`}
function shell(){const r=R[S.role],nav=c=>'<i class="ind nt"></i>'+r.t.map(([k,l,i])=>`<button class="${c}" data-a="tab" data-t="${k}" data-k="${k}">${ic(i)}<span>${l}</span></button>`).join("");$("#app").innerHTML=`<div class="shell"><aside class="side"><div class="brand"><span class="logo">${ic("scis")}</span><div><b>Your Salon</b><small>${r.n} · Live</small></div></div><nav>${nav("nv")}</nav></aside><div class="main"><header class="top"><div><small>YOUR SALON · ${r.n.toUpperCase()}</small><h1 id="ttl"></h1><small id="sub"></small></div><div class="acts">${tbtn()}<button class="ib" data-a="out" aria-label="Logout">${ic("out")}</button></div></header><main id="view"></main></div><nav class="bnav">${nav("bn")}</nav></div>`}
function ind(x){document.querySelectorAll(".bnav,.side nav").forEach(n=>{const o=n.querySelector(".on"),i=n.querySelector(".ind");if(!o||!i)return;if(x)i.classList.add("nt");i.style.width=o.offsetWidth+"px";i.style.height=o.offsetHeight+"px";i.style.transform="translate("+o.offsetLeft+"px,"+o.offsetTop+"px)";if(i.classList.contains("nt"))requestAnimationFrame(()=>requestAnimationFrame(()=>i.classList.remove("nt")))})}
function go(t){const k=++go.n;S.tab=t;document.querySelectorAll("[data-k]").forEach(b=>b.classList.toggle("on",b.dataset.k==t));ind();const v=$("#view"),run=()=>{if(k!=go.n)return;$("#ttl").textContent=T[t];$("#sub").textContent=SUB[t];v.classList.remove("lv");draw(true);scrollTo({top:0,behavior:"instant"})};if(v.firstChild&&!matchMedia("(prefers-reduced-motion:reduce)").matches){v.classList.add("lv");setTimeout(run,130)}else run()}go.n=0;
function draw(anim){const v=$("#view");if(!v)return;const sc=[...v.querySelectorAll(".pks,.dr,.chips")].map(e=>e.scrollLeft);v.innerHTML=V[S.tab]();if(!anim)v.querySelectorAll(".pks,.dr,.chips").forEach((e,i)=>e.scrollLeft=sc[i]||0);v.classList.remove("in");if(anim){void v.offsetWidth;v.classList.add("in")}post(anim);rv()}
function post(anim){document.querySelectorAll("[data-cu]").forEach(el=>{if(!anim)return;const to=+el.dataset.cu;let s=null;const f=ts=>{s=s||ts;const p=Math.min((ts-s)/900,1);el.textContent=fs(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)});requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll("[data-w],[data-off],[data-h]").forEach(e=>{if(!anim)e.style.transition="none";if(e.dataset.w)e.style.width=e.dataset.w+"%";if(e.dataset.off)e.style.strokeDashoffset=e.dataset.off;if(e.dataset.h)e.style.height=e.dataset.h+"%"})))}
function rv(){const els=document.querySelectorAll(".rv");if(!els.length)return;const cn=el=>{const to=+el.dataset.to,dc=+(el.dataset.dec||0),sf=el.dataset.suf||"";let s=null;const f=ts=>{s=s||ts;const p=Math.min((ts-s)/1400,1),v=to*(1-Math.pow(1-p,3));el.textContent=(dc?v.toFixed(dc):Math.round(v))+sf;if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)};if(!("IntersectionObserver" in window)){els.forEach(e=>{e.classList.add("vis");e.querySelectorAll(".cn").forEach(c=>c.textContent=c.dataset.to+(c.dataset.suf||""))});return}const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("vis");x.target.querySelectorAll(".cn").forEach(cn);io.unobserve(x.target)}}),{threshold:.12,rootMargin:"0px 0px -30px 0px"});els.forEach(e=>io.observe(e))}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),2400)}
function theme(){const d=document.documentElement,n=d.dataset.theme=="dark"?"light":"dark";d.dataset.theme=n;try{localStorage.setItem("sth",n)}catch(e){}$("#tc").content=n=="dark"?"#000":"#fafafa"}
function adv(){const c=S.q.findIndex(x=>x.st=="cook");if(c>=0){const d=S.q.splice(c,1)[0];if(d.me)S.q.push(d)}const w=S.q.find(x=>x.st=="wait"&&!x.me);if(w){w.st="cook";w.p=15}if(S.q.filter(x=>x.st=="cook").length<2){const w2=S.q.find(x=>x.st=="wait"&&!x.me);if(w2){w2.st="cook";w2.p=10}}S.q.forEach(x=>{if(x.st=="cook"&&x.me)x.st="cook"});const m=S.q.findIndex(x=>x.me),k=S.q.slice(0,m).some(x=>x.st=="wait"||x.st=="cook");if(m>=0&&!k){S.q[m].st="cook";S.q[m].p=20}draw(true);toast("Line moved forward")}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v,i=+b.dataset.i;switch(a){
case"theme":theme();break;case"pick":S.pr=v;document.querySelectorAll("#rs button").forEach(x=>x.classList.toggle("on",x.dataset.v==v));break;
case"login":S.role=S.pr;shell();go(R[S.role].t[0][0]);break;case"out":S.role=null;loginUI();break;case"tab":go(b.dataset.t);break;
case"svc":toggle(S.bs,i);S.pk=-1;draw();break;case"pkg":if(S.pk==i)S.pk=-1;else{S.bs=[...PK[i].it];S.pk=i}draw();break;case"bcat":S.bc=v;draw();break;case"tosl":{const e=document.getElementById("tm");if(e)e.scrollIntoView({behavior:"smooth",block:"center"});toast("Pick a time to continue");break}case"dq":S.done=null;go("queue");break;case"dn":S.done=null;draw();break;case"sty":S.bst=v;draw();break;case"day":S.bd=+v;S.bt="";draw();break;case"slot":S.bt=v;draw();break;
case"conf":{const B=bsum(),sy=S.bst=="Any"?free():S.bst,dd=new Date();dd.setDate(dd.getDate()+S.bd);S.taken.push(S.bd+S.bst+S.bt);if(S.bd==0)S.bk.push({tm:S.bt.replace(/ [AP]M/,""),n:"You",v:sn(S.bs),s:sy,st:0});S.done={id:"BK"+(1000+Math.floor(Math.random()*9000)),sv:sn(S.bs),sy,w:(S.bd?DN[dd.getDay()]+" "+dd.getDate()+" "+MO[dd.getMonth()]:"Today")+" · "+S.bt,p:B.p,d:B.d};S.bt="";draw();break}
case"adv":adv();break;case"bks":S.bk[i].st=(S.bk[i].st+1)%3;draw();break;
case"rsl":S.rs=v;draw();break;case"rbook":toast("Slot booked: "+(S.rs||"Tomorrow 6:30 PM"));break;
case"wsv":toggle(S.ws,i);draw();break;case"wadd":{const old=(S.ph||"").replace(/\D/g,"").length>=10;S.q.push({t:S.tn,n:old?"Imran Q.":"Walk-in",v:sn(S.ws),s:free(),st:"wait"});toast("Token #"+S.tn+" issued. Queue link sent on WhatsApp");S.tn++;S.ph="";draw();break}
case"bsv":toggle(S.bill,i);draw();break;case"pay":S.pay=v;draw();break;
case"sbill":{const t=tot(S.bill);S.pay=="UPI"?S.upi+=t:S.cash+=t;try{window.open("https://wa.me/?text="+encodeURIComponent("Your Salon bill: "+sn(S.bill)+". Total "+fmt(t)),"_blank")}catch(x){}toast("Bill sent · "+fmt(t));break}
case"per":S.per=v;draw();break;case"cwa":try{window.open("https://wa.me/?text="+encodeURIComponent("Your Salon commission ("+S.per+") is ready"),"_blank")}catch(x){}toast("Sent the breakdown to staff");break}});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.in=="ph"){S.ph=t.value;$("#wb").innerHTML=wib()}if(t.closest(".otp")&&t.value&&t.nextElementSibling)t.nextElementSibling.focus()});
let tk=0;addEventListener("scroll",()=>{if(tk)return;tk=requestAnimationFrame(()=>{tk=0;const t=$(".top");if(t)t.classList.toggle("sc",scrollY>6)})},{passive:true});let rz=0;addEventListener("resize",()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(()=>ind(1))});addEventListener("orientationchange",()=>setTimeout(()=>ind(1),250));if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>ind(1));
loginUI();
</script></body></html>
